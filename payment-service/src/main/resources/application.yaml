spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_payment}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER:projet}
    password: ${DB_PASSWORD:projet}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Redis (idempotency cache – payment-service ONLY) ─────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms

server:
  port: ${SERVER_PORT:8083}

# ── Inter-service HTTP client configuration ───────────────────────────────────
services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://account-service:8082}

# ── Actuator / Observability (4 Golden Signals) ──────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: payment-service
    distribution:
      percentiles-histogram:
        http.server.requests: true        # Latency histograms (P50/P95/P99)
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    enable:
      jvm: true       # Saturation: heap, threads, GC
      process: true
      system: true