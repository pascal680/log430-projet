# Nginx load balancer — tous les services (mode LB)
#
# KrakenD → nginx-lb:8081 → identity pool
# KrakenD → nginx-lb:8082 → account pool
# KrakenD → nginx-lb:8083 → payment pool
# Prometheus exporter → nginx-lb:80/nginx_status
#
# Algorithme : least_conn avec failover passif (3 échecs / 10 s)

upstream identity_upstream {
    least_conn;
    server identity-service:8081   max_fails=3 fail_timeout=10s;
    server identity-service-2:8081 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream account_upstream {
    least_conn;
    server account-service:8082   max_fails=3 fail_timeout=10s;
    server account-service-2:8082 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream payment_upstream {
    least_conn;
    server payment-service:8083   max_fails=3 fail_timeout=10s;
    server payment-service-2:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8081;
    server_name _;
    access_log off;

    location / {
        proxy_pass             http://identity_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
    }
}

server {
    listen 8082;
    server_name _;
    access_log off;

    location / {
        proxy_pass             http://account_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
    }
}

server {
    listen 8083;
    server_name _;
    access_log /var/log/nginx/payment_lb_access.log;
    error_log  /var/log/nginx/payment_lb_error.log warn;

    location / {
        proxy_pass             http://payment_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }
}

# Port 80 — health check + métriques Prometheus
server {
    listen 80 default_server;
    server_name _;
    access_log off;

    location /nginx-health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx_status {
        stub_status;
        access_log off;
    }

    location / {
        return 444;
    }
}
