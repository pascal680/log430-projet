# ── CanBankX – Unified Nginx Load Balancer (all three service pools) ──────────
#
# Topology (LB mode):
#   KrakenD → nginx-lb:8081 → identity-service:8081  + identity-service-2:8081
#   KrakenD → nginx-lb:8082 → account-service:8082   + account-service-2:8082
#   KrakenD → nginx-lb:8083 → payment-service:8083   + payment-service-2:8083
#   Prometheus exporter  → nginx-lb:80/nginx_status
#
# Algorithm : least_conn  (better than round-robin for variable-duration requests)
# Failover  : passive – a backend is removed after 3 failures in 10 s
# Keepalive : idle upstream connections reused across requests
# ──────────────────────────────────────────────────────────────────────────────

# ── Upstream pools ─────────────────────────────────────────────────────────────

upstream identity_upstream {
    least_conn;
    server identity-service:8081   max_fails=3 fail_timeout=10s;
    server identity-service-2:8081 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream account_upstream {
    least_conn;
    server account-service:8082   max_fails=3 fail_timeout=10s;
    server account-service-2:8082 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream payment_upstream {
    least_conn;
    server payment-service:8083   max_fails=3 fail_timeout=10s;
    server payment-service-2:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── Shared proxy settings snippet (repeated per server block) ──────────────────
# nginx doesn't support include inside server blocks in all versions,
# so settings are inlined for compatibility.

# ── Identity LB – port 8081 ────────────────────────────────────────────────────
server {
    listen 8081;
    server_name _;
    access_log off;

    location / {
        proxy_pass             http://identity_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
    }
}

# ── Account LB – port 8082 ─────────────────────────────────────────────────────
server {
    listen 8082;
    server_name _;
    access_log off;

    location / {
        proxy_pass             http://account_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
    }
}

# ── Payment LB – port 8083 ─────────────────────────────────────────────────────
server {
    listen 8083;
    server_name _;
    access_log /var/log/nginx/payment_lb_access.log;
    error_log  /var/log/nginx/payment_lb_error.log warn;

    location / {
        proxy_pass             http://payment_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 5s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }
}

# ── Admin – port 80 (health check + stub_status for Prometheus exporter) ───────
server {
    listen 80 default_server;
    server_name _;
    access_log off;

    location /nginx-health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx_status {
        stub_status;
        access_log off;
    }

    location / {
        return 444;
    }
}
