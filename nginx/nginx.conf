# ── CanBankX – Nginx Load Balancer for payment-service ────────────────────────
#
# Topology:
#   KrakenD → nginx-payment-lb:80 → payment-service:8083
#                                 → payment-service-2:8083
#
# Algorithm : least_conn  (better than round-robin for long-lived DB transactions)
# Failover  : passive – a backend is removed after 3 failures in 10 s
# Keepalive : 32 idle upstream connections reused across requests
# ──────────────────────────────────────────────────────────────────────────────

upstream payment_upstream {
    least_conn;

    server payment-service:8083  max_fails=3 fail_timeout=10s;
    server payment-service-2:8083 max_fails=3 fail_timeout=10s;

    # Reuse TCP connections to upstream (HTTP/1.1 keepalive)
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/payment_lb_access.log;
    error_log  /var/log/nginx/payment_lb_error.log warn;

    # ── Main proxy to payment-service pool ────────────────────────────────────
    location / {
        proxy_pass         http://payment_upstream;

        # Use HTTP/1.1 so keepalive works with upstream pool
        proxy_http_version 1.1;
        proxy_set_header   Connection "";          # clear so keepalive isn't closed

        # Standard forwarding headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts aligned with KrakenD's 15 s global timeout
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;

        # On error or timeout, try the other upstream instance once
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Buffer settings (keeps memory usage predictable)
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Docker health check endpoint ──────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── stub_status – scraped by nginx-prometheus-exporter ────────────────────
    location /nginx_status {
        stub_status;
        access_log off;
        # Allow all (internal Docker network only – no host-port exposure)
    }
}
