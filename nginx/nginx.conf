# Nginx load balancer — payment-service uniquement (non utilisé en mode LB complet)
# En mode LB complet, nginx-all.conf remplace ce fichier.
# least_conn + failover passif (3 échecs / 10 s)

upstream payment_upstream {
    least_conn;
    server payment-service:8083   max_fails=3 fail_timeout=10s;
    server payment-service-2:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/payment_lb_access.log;
    error_log  /var/log/nginx/payment_lb_error.log warn;

    location / {
        proxy_pass             http://payment_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  3s;
        proxy_send_timeout     20s;
        proxy_read_timeout     20s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx_status {
        stub_status;
        access_log off;
    }
}