spring:
  application:
    name: LOG430-projet

  # Disable auto-generated security password in console
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN

  datasource:
    url: jdbc:mysql://localhost:3306/log430_projet
    username: projet
    password: projet
