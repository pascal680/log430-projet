global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Each job groups primary + replica so the "Healthy Services" Grafana panel
  # (up{job=~"identity-service|account-service|payment-service"} == 1) correctly
  # counts 3 in non-LB mode and 6 in --profile lb mode.
  # Replica targets that don't exist (non-LB) are simply marked DOWN by Prometheus
  # and do not affect primary-instance scraping.
  - job_name: 'identity-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['identity-service:8081', 'identity-service-2:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['account-service:8082', 'account-service-2:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8083', 'payment-service-2:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # nginx-lb exporter – only exists with --profile lb (DOWN otherwise, harmless)
  - job_name: 'nginx-lb'
    static_configs:
      - targets: ['nginx-exporter:9113']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance