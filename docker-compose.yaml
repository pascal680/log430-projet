services:

  # ── identity-service (UC-01, UC-02) – MySQL only ──────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_identity
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── account-service (UC-03, UC-04) – MySQL only ───────────────────────────
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── payment-service (UC-05) – MySQL + Redis (idempotency cache) ───────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_payment
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8083
      ACCOUNT_SERVICE_URL: http://account-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── identity-service replica (LB instance 2) ─────────────────────────────
  # Only starts with:  docker compose --profile lb up -d
  identity-service-2:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service-2
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_identity
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── account-service replica (LB instance 2) ───────────────────────────────
  # Only starts with:  docker compose --profile lb up -d
  account-service-2:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service-2
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── payment-service replica (LB instance 2 — Nginx least-conn pool) ────────
  # Only starts with:  docker compose --profile lb up -d
  payment-service-2:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service-2
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_payment
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8083
      ACCOUNT_SERVICE_URL: http://account-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Nginx Load Balancer (all three service pools) ────────────────────────
  # Only starts with:  docker compose --profile lb up -d
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    profiles: ["lb"]
    volumes:
      - ./nginx/nginx-all.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      identity-service-2:
        condition: service_healthy
      account-service:
        condition: service_healthy
      account-service-2:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      payment-service-2:
        condition: service_healthy
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Nginx Prometheus Exporter (scrapes /nginx_status → Prometheus) ────────
  # Only starts with:  docker compose --profile lb up -d
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    profiles: ["lb"]
    command:
      - --nginx.scrape-uri=http://nginx-lb:80/nginx_status
    depends_on:
      - nginx-lb
    networks:
      - log430_projet-network
    restart: unless-stopped

  # ── MySQL (shared host, isolated schemas per service) ────────────────────
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_DATABASE not set here – init.sql creates all 3 schemas
    networks:
      - log430_projet-network
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── DB-init (re-applies grants every startup, idempotent) ─────────────────
  # Solves the issue where MySQL volumes pre-exist and init.sql never re-runs.
  # Mounts the same init.sql used for first-boot and replays it as root.
  # --ssl-mode=DISABLED avoids caching_sha2_password SSL handshake issues in
  # MySQL 8.4 when connecting from another container over the Docker bridge.
  db-init:
    image: mysql:8.4.7
    restart: "no"
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - log430_projet-network
    volumes:
      - ./db-init/init.sql:/init.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MySQL to be fully ready..."
        until mysql -h mysql -u root -p$$DB_ROOT_PASSWORD --ssl-mode=DISABLED --get-server-public-key -e "SELECT 1" >/dev/null 2>&1; do
          echo "MySQL not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "Applying grants from init.sql..."
        if ! mysql -h mysql -u root -p$$DB_ROOT_PASSWORD --ssl-mode=DISABLED --get-server-public-key < /init.sql; then
          echo "ERROR: init.sql failed – check MySQL logs for details."
          exit 1
        fi
        echo "Grants applied successfully."

  # ── Redis (payment-service idempotency cache only) ────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - log430_projet-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MailHog (catches outbound emails in dev – no real SMTP needed) ─────────
  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64   # no ARM64 image exists; Rosetta emulation on Apple Silicon
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP – services send mail here
      - "8025:8025"   # Web UI – view captured emails at http://localhost:8025
    networks:
      - log430_projet-network
    restart: unless-stopped

  # ── Prometheus (scrapes all 3 services) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - log430_projet-network
    restart: unless-stopped

  # ── Grafana (dashboard UI – auto-provisioned datasource + dashboard) ────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - log430_projet-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── KrakenD API Gateway ───────────────────────────────────────────────────
  # LB OFF (default): KRAKEND_CONFIG not set → mounts krakend-nolb.json
  # LB ON:            KRAKEND_CONFIG=krakend.json + --profile lb
  krakend:
    image: devopsfaith/krakend:2.7
    container_name: krakend
    ports:
      - "8080:8080"
    volumes:
      - ./krakend/${KRAKEND_CONFIG:-krakend-nolb.json}:/etc/krakend/krakend.json
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      identity-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - log430_projet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend Developer Portal ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:3000"
    depends_on:
      krakend:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - log430_projet-network
    restart: unless-stopped

  # ── k6 load tester ────────────────────────────────────────────────────────
  # Not started by default. Run individual tests with:
  #   docker compose run --rm k6 run /tests/smoke-test.js
  #   docker compose run --rm k6 run /tests/load-test.js
  #   docker compose run --rm k6 run /tests/stress-test.js
  k6:
    image: grafana/k6:latest
    profiles:
      - testing
    volumes:
      - ./k6:/tests
    networks:
      - log430_projet-network
    environment:
      BASE_URL:     http://krakend:8080
      IDENTITY_URL: http://identity-service:8081
      ACCOUNT_URL:  http://account-service:8082
      PAYMENT_URL:  http://payment-service:8083
      MAILHOG_URL:  http://mailhog:8025

networks:
  log430_projet-network:
    external: true

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
