services:

  # identity-service — UC-01 Inscription, UC-02 Auth MFA
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    ports:
      - "28081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_identity
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # account-service — UC-03 Comptes, UC-04 Soldes
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    ports:
      - "28082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
      BANK_PARTICIPANT_ID: ${BANK_PARTICIPANT_ID:-participant-003}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-canbankx-phase2-kafka-1:9094}
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Internal responder for participant-002 (no host port).
  # This enables phase2 CREDIT_REQUESTED -> SETTLED without manual Kafka injection.
  account-service-p002:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
      BANK_PARTICIPANT_ID: participant-002
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-canbankx-phase2-kafka-1:9094}
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # account-service participant-002 responder for phase2 interbank saga
  # Internal-only: no published host port required.
  account-service-participant-002:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
      BANK_PARTICIPANT_ID: participant-002
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-canbankx-phase2-kafka-1:9094}
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # payment-service — UC-05 Virements (Redis idempotency + inter-service calls)
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "28083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_payment
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: demo
      SPRING_SECURITY_USER_PASSWORD: demo123!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8083
      ACCOUNT_SERVICE_URL: http://account-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CENTRAL_BANK_URL: ${CENTRAL_BANK_URL:-http://host.docker.internal:18080}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Réplique identity-service pour le mode LB (--profile lb)
  # Only starts with:  docker compose --profile lb up -d
  identity-service-2:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_identity
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Réplique account-service pour le mode LB (--profile lb)
  # Only starts with:  docker compose --profile lb up -d
  account-service-2:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_account
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8082
      BANK_PARTICIPANT_ID: ${BANK_PARTICIPANT_ID:-participant-003}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-canbankx-phase2-kafka-1:9094}
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Réplique payment-service pour le mode LB (--profile lb)
  # Les appels inter-services passent par nginx-lb pour répartir la charge
  # Only starts with:  docker compose --profile lb up -d
  payment-service-2:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    profiles: ["lb"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_payment
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: demo
      SPRING_SECURITY_USER_PASSWORD: demo123!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8083
      # Route internal calls through nginx-lb so account/identity replicas
      # also receive inter-service traffic (nginx-lb always exists in lb mode)
      ACCOUNT_SERVICE_URL: http://nginx-lb:8082
      IDENTITY_SERVICE_URL: http://nginx-lb:8081
      CENTRAL_BANK_URL: ${CENTRAL_BANK_URL:-http://host.docker.internal:18080}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Nginx load balancer — ports 8081/8082/8083 → upstream pools (--profile lb)
  # Only starts with:  docker compose --profile lb up -d
  nginx-lb:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    volumes:
      - ./nginx/nginx-all.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      identity-service-2:
        condition: service_healthy
      account-service:
        condition: service_healthy
      account-service-2:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      payment-service-2:
        condition: service_healthy
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Exporte les métriques nginx vers Prometheus (--profile lb)
  # Only starts with:  docker compose --profile lb up -d
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    profiles: ["lb"]
    command:
      - --nginx.scrape-uri=http://nginx-lb:80/nginx_status
    depends_on:
      - nginx-lb
    networks:
      - canbankx-net
    restart: unless-stopped

  # MySQL — schémas db_identity, db_account, db_payment (voir ADR-004)
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_DATABASE not set here – init.sql creates all 3 schemas
    networks:
      - canbankx-net
    ports:
      - "${DB_PORT:-23306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Réapplique les grants MySQL à chaque démarrage (idempotent)
  # Solves the issue where MySQL volumes pre-exist and init.sql never re-runs.
  # Mounts the same init.sql used for first-boot and replays it as root.
  # --ssl-mode=DISABLED avoids caching_sha2_password SSL handshake issues in
  # MySQL 8.4 when connecting from another container over the Docker bridge.
  db-init:
    image: mysql:8.4.7
    restart: "no"
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - canbankx-net
    volumes:
      - ./db-init/init.sql:/init.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MySQL to be fully ready..."
        until mysql -h mysql -u root -p$$DB_ROOT_PASSWORD --ssl-mode=DISABLED --get-server-public-key -e "SELECT 1" >/dev/null 2>&1; do
          echo "MySQL not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "Applying grants from init.sql..."
        if ! mysql -h mysql -u root -p$$DB_ROOT_PASSWORD --ssl-mode=DISABLED --get-server-public-key < /init.sql; then
          echo "ERROR: init.sql failed – check MySQL logs for details."
          exit 1
        fi
        echo "Grants applied successfully."

  # Redis — tokens MFA (5 min TTL) + clés idempotency paiements (24h TTL)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - canbankx-net
    ports:
      - "${REDIS_PORT:-26379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MailHog — capture les emails OTP en dev (pas de vrai SMTP)
  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64   # no ARM64 image exists; Rosetta emulation on Apple Silicon
    ports:
      - "21025:1025"   # SMTP (host) -> container 1025
      - "28025:8025"   # Web UI at http://localhost:28025
    networks:
      - canbankx-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - canbankx-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "23000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - canbankx-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # KrakenD — KRAKEND_CONFIG not set → krakend-nolb.json (direct)
  #           KRAKEND_CONFIG=krakend.json + --profile lb → mode LB
  krakend:
    image: devopsfaith/krakend:2.7
    ports:
      - "28080:8080"
    volumes:
      - ./krakend/${KRAKEND_CONFIG:-krakend-nolb.json}:/etc/krakend/krakend.json
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      identity-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      # Optional: only present when --profile lb is used.
      # required: false means Compose skips this dependency silently in no-LB mode.
      nginx-lb:
        condition: service_healthy
        required: false
    networks:
      - canbankx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "25173:3000"
    depends_on:
      krakend:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - canbankx-net
    restart: unless-stopped

  # k6 — démarrer avec: docker compose --profile testing run --rm k6 run /tests/<script>.js
  k6:
    image: grafana/k6:latest
    profiles:
      - testing
    volumes:
      - ./k6:/tests
    networks:
      - canbankx-net
    environment:
      BASE_URL:     http://krakend:8080
      IDENTITY_URL: http://identity-service:8081
      ACCOUNT_URL:  http://account-service:8082
      PAYMENT_URL:  http://payment-service:8083
      MAILHOG_URL:  http://mailhog:8025

networks:
  canbankx-net:
    external: true
    name: canbankx-net

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

